<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timeline</title>
  <!-- The theme's fonts: EB Garamond for headings and names, Roboto and Noto Sans JP for text.
       Without internet, the page uses the computer's own fonts instead. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400..700&family=Noto+Sans+JP:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top-bar">
    <div class="top-bar-inner">
      <a class="brand" href="#/">Timeline</a>
      <div id="account-bar" class="account-bar" hidden>
        <span>Logged in as <strong id="me-name"></strong></span>
        <button type="button" id="log-out" class="small-button">Log out</button>
      </div>
    </div>
  </header>

  <main>
    <form id="login-form" class="card" hidden>
      <h2 class="card-title">Join the conversation</h2>
      <p class="card-hint">Anyone can read the timeline. Log in, or sign up with a new name, to post, reply and like.</p>
      <label for="login-name">Name</label>
      <input id="login-name" type="text" autocomplete="username" maxlength="40">
      <label for="login-password">Password <span class="label-hint">(at least 8 characters)</span></label>
      <input id="login-password" type="password" autocomplete="current-password">
      <div class="login-buttons">
        <button type="submit">Log in</button>
        <button type="button" id="sign-up" class="secondary-button">Sign up</button>
      </div>
    </form>

    <form id="post-form" class="card" hidden>
      <label for="text">What is happening?</label>
      <p id="mode-line" class="mode-line" hidden>
        <span id="mode-text"></span>
        <button type="button" id="cancel-mode" class="small-button">Cancel</button>
      </p>
      <textarea id="text" rows="3" placeholder="What is happening?"></textarea>
      <div class="post-row">
        <span id="count" class="count">0 / 280</span>
        <button type="submit" id="submit-button">Post</button>
      </div>
    </form>

    <p id="status" class="status" role="status"></p>

    <ol id="timeline" class="timeline" aria-label="Posts, newest first"></ol>
  </main>

  <script src="app.js"></script>
</body>
</html>
